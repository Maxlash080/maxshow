<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All events — MAXSHOW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{ink:'#17202A',coral:'#F2634E',cream:'#FFF9F2'}}}}</script>
    <link rel="stylesheet" href="theme.css?v=2">
    <script src="theme.js" defer></script>
    <script src="common.js" defer></script>
</head>
<body class="min-h-screen bg-cream text-ink">
    <header class="border-b border-stone-200 bg-cream">
        <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-5 lg:px-8">
            <a href="index.html" class="flex items-center gap-2.5">
                <span class="grid h-10 w-10 place-items-center rounded-2xl bg-coral text-xl font-black text-white">M</span>
                <span class="text-xl font-black">MAXSHOW</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="index.html" class="rounded-full border border-stone-300 bg-white px-4 py-2 text-sm font-bold">← Home</a>
                <span id="account-action"></span>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-5 py-12 lg:px-8">
        <p class="text-sm font-bold uppercase tracking-[.16em] text-coral">Find your next plan</p>
        <h1 class="mt-2 text-4xl font-black tracking-tight sm:text-5xl">All experiences</h1>
        <p class="mt-4 max-w-xl text-slate-600">Browse events happening around Pimpri, Chinchwad, Hinjawadi, Punawale, Kasarwadi, Nigdi, and Aundh.</p>

        <div class="mt-9 flex flex-wrap gap-2">
            <button data-filter="all" class="filter rounded-full bg-ink px-4 py-2 text-sm font-bold text-white">All events</button>
            <button data-filter="music" class="filter rounded-full border border-stone-300 bg-white px-4 py-2 text-sm font-bold">Music</button>
            <button data-filter="comedy" class="filter rounded-full border border-stone-300 bg-white px-4 py-2 text-sm font-bold">Comedy</button>
            <button data-filter="create" class="filter rounded-full border border-stone-300 bg-white px-4 py-2 text-sm font-bold">Workshops</button>
            <button data-filter="outdoors" class="filter rounded-full border border-stone-300 bg-white px-4 py-2 text-sm font-bold">Outdoors</button>
        </div>

        <p id="count" class="mt-7 text-sm font-semibold text-slate-500"></p>
        <section id="events" class="mt-5 grid gap-6 sm:grid-cols-2 lg:grid-cols-4"></section>
        <p id="empty" class="hidden py-12 text-center font-semibold text-slate-500">No events in this category right now.</p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.filter');
            const grid = document.getElementById('events');
            const count = document.getElementById('count');
            const empty = document.getElementById('empty');
            let currentFilter = 'all';

            // Initial render from fallback events
            if (grid && typeof FALLBACK_EVENTS !== 'undefined') {
                grid.innerHTML = Object.values(FALLBACK_EVENTS).map(createAllEventsCardHTML).join('');
                filter('all');
            }

            function filter(value) {
                currentFilter = value;
                const cards = document.querySelectorAll('.event');
                let n = 0;
                cards.forEach(c => {
                    const show = value === 'all' || c.dataset.category === value;
                    c.classList.toggle('hidden', !show);
                    if (show) n++;
                });
                count.textContent = `${n} experience${n === 1 ? '' : 's'} to explore`;
                empty.classList.toggle('hidden', n > 0);
                buttons.forEach(b => {
                    b.className = `filter rounded-full px-4 py-2 text-sm font-bold ${b.dataset.filter === value ? 'bg-ink text-white' : 'border border-stone-300 bg-white'}`;
                });
            }

            buttons.forEach(b => b.addEventListener('click', () => filter(b.dataset.filter)));

            apiRequest('/api/events')
                .then(({ events }) => {
                    if (events && events.length) {
                        grid.innerHTML = events.map(createAllEventsCardHTML).join('');
                        filter(currentFilter);
                    }
                })
                .catch(() => {});
        });
    </script>
</body>
</html>
