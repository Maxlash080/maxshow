# Rate Limiting & Connection Limiting Zones
limit_req_zone $binary_remote_addr zone=global_req_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

limit_conn_status 429;
limit_req_status 429;

# Block Malicious User Agents & Vulnerability Scanners
map $http_user_agent $blocked_agent {
    default 0;
    ~*(sqlmap|nikto|wpscan|masscan|nmap|havij|acunetix|dirbuster|pangolin|zgrab) 1;
}
