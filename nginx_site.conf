server {
    server_name maxshow.site www.maxshow.site;

    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Block Bad Bots & Vulnerability Scanners
    if ($blocked_agent) {
        return 403;
    }

    # Block Hidden and Sensitive Files (.env, .git, .sqlite, etc.)
    location ~* /\.(env|git|htaccess|htpasswd|sql|sqlite|db|bak|config) {
        deny all;
        return 404;
    }

    # Block Common Exploit Paths (WordPress exploits, PHP scripts)
    location ~* /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|admin\.php) {
        deny all;
        return 404;
    }

    # Rate Limiting on Auth/Login Endpoints (Brute-force protection)
    location ~* ^/api/(auth/admin-login|admin/login|auth/login) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Global proxy location with general rate limit
    location / {
        limit_req zone=global_req_limit burst=80 nodelay;
        limit_conn conn_limit 40;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE Buffering off for real-time live stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/maxshow.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maxshow.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.maxshow.site) {
        return 301 https://$host$request_uri;
    }

    if ($host = maxshow.site) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name maxshow.site www.maxshow.site;
    return 404;
}
